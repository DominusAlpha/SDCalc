<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>WARDOGS · Distance</title><style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f3f4f6;min-height:100dvh;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}main{max-width:520px;margin:0 auto;padding:32px 0}h1{font-size:24px;margin:0 0 8px}.sub{color:#9ca3af;font-size:14px;margin:0 0 28px}.panel{background:#172235;border:1px solid #334155;border-radius:18px;padding:18px;margin-bottom:16px}h2{font-size:15px;color:#cbd5e1;margin:0 0 14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#9ca3af;font-size:13px}input{width:100%;margin-top:7px;border:1px solid #475569;border-radius:12px;background:#0f172a;color:white;padding:14px;font-size:20px;font-variant-numeric:tabular-nums;outline:none}input:focus{border-color:#93c5fd}.result{text-align:center;background:#1d3551;border:1px solid #3b82f6;border-radius:18px;padding:25px 12px}.result small{color:#bfdbfe}.number{font-size:48px;font-weight:750;margin:10px 0;letter-spacing:-2px;font-variant-numeric:tabular-nums}.unit{color:#cbd5e1;font-size:13px}.actions{display:flex;gap:10px;margin:16px 0}button{flex:1;padding:14px;border-radius:12px;border:1px solid #475569;background:#243247;color:white;font-size:15px;font-weight:600}button:active{opacity:.7}.note{font-size:13px;line-height:1.5;color:#94a3b8;margin-top:18px}</style></head><body><main><h1>WARDOGS · Distance</h1><p class="sub">Калькулятор відстані між двома точками</p><section class="panel"><h2>📍 Твоя позиція</h2><div class="fields"><label>X<input id="x1" inputmode="decimal" type="text" placeholder="100" autocomplete="off"></label><label>Y<input id="y1" inputmode="decimal" type="text" placeholder="200" autocomplete="off"></label></div></section><section class="panel"><h2>🎯 Ціль</h2><div class="fields"><label>X<input id="x2" inputmode="decimal" type="text" placeholder="400" autocomplete="off"></label><label>Y<input id="y2" inputmode="decimal" type="text" placeholder="600" autocomplete="off"></label></div></section><section class="result" aria-live="polite"><small>ВІДСТАНЬ</small><div class="number" id="distance">—</div><div class="unit">координатних одиниць</div></section><div class="actions"><button id="swap">⇅ Поміняти місцями</button><button id="clear">Очистити</button></div><p class="note">Відстань розраховується як √((X₂−X₁)²+(Y₂−Y₁)²). Якщо одна координатна одиниця дорівнює одному метру, результат буде в метрах. Працює без інтернету після збереження файлу.</p></main><script>const ids=['x1','y1','x2','y2'];const inputs=ids.map(id=>document.getElementById(id));const output=document.getElementById('distance');function num(v){return Number(v.trim().replace(',','.'))}function calculate(){const v=inputs.map(e=>e.value);output.textContent=v.every(s=>s.trim()!==''&&Number.isFinite(num(s)))?Math.hypot(num(v[2])-num(v[0]),num(v[3])-num(v[1])).toLocaleString('uk-UA',{maximumFractionDigits:2}):'—'}inputs.forEach(e=>e.addEventListener('input',calculate));document.getElementById('clear').onclick=()=>{inputs.forEach(e=>e.value='');calculate();inputs[0].focus()};document.getElementById('swap').onclick=()=>{[inputs[0].value,inputs[2].value]=[inputs[2].value,inputs[0].value];[inputs[1].value,inputs[3].value]=[inputs[3].value,inputs[1].value];calculate()};</script></body></html>
